<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 220" width="600" height="440" role="img" aria-label="Animated preview of brainny's Brain view: a probe circling a hierarchical edge-bundled mesh of ideas, pausing to show a readiness percentage">
  <title>brainny — Brain view preview</title>
  <rect x="0" y="0" width="300" height="220" fill="#0b1310"/>

  <!-- invisible orbit path the probe follows -->
  <path id="orbit" d="M 150,10 A 95,95 0 1 1 149.99,10" fill="none" stroke="none"/>

  <!-- bundled connections, curved through the center like the real view -->
  <g fill="none" stroke-width="1.4" opacity="0.75">
    <path id="lnk1" d="M 150,35 Q 150,100 70,150" stroke="#3b6fd6"/>
    <path id="lnk2" d="M 220,60 Q 150,100 80,55" stroke="#8b5cd6"/>
    <path d="M 230,140 Q 150,100 150,35" stroke="#2f9e5e"/>
    <path d="M 70,150 Q 150,100 220,60" stroke="#c9432c"/>
    <path d="M 80,55 Q 150,100 230,140" stroke="#e8b23d"/>
    <path d="M 55,100 Q 150,100 150,175" stroke="#3bb0a8"/>
    <path d="M 150,175 Q 150,100 55,100" stroke="#e05a9a"/>
  </g>

  <!-- leaf nodes -->
  <g stroke="#0b1310" stroke-width="0.6">
    <circle cx="150" cy="35" r="4" fill="#3b6fd6"/>
    <circle cx="220" cy="60" r="3.4" fill="#8b5cd6"/>
    <circle cx="230" cy="140" r="4.6" fill="#2f9e5e"/>
    <circle cx="150" cy="175" r="3.4" fill="#e8b23d"/>
    <circle cx="70" cy="150" r="4" fill="#c9432c"/>
    <circle cx="55" cy="100" r="3.4" fill="#3bb0a8"/>
    <circle cx="80" cy="55" r="4" fill="#e05a9a"/>
  </g>

  <!-- bidirectional synapse pulses riding two of the bundled links -->
  <circle r="2.2" fill="#fff3d0">
    <animateMotion dur="2.6s" repeatCount="indefinite">
      <mpath xlink:href="#lnk1"/>
    </animateMotion>
  </circle>
  <circle r="2.2" fill="#fff3d0">
    <animateMotion dur="3.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath xlink:href="#lnk2"/>
    </animateMotion>
  </circle>

  <!-- the probe, circling continuously -->
  <g>
    <circle r="8" fill="#ffe08c" opacity="0.18"/>
    <circle r="3.4" fill="#ffe08c"/>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#orbit"/>
    </animateMotion>
  </g>

  <!-- readiness readout, fading in as the probe passes a ready idea -->
  <text x="150" y="105" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#fff3d0" stroke="#070c0a" stroke-width="3" paint-order="stroke" opacity="0">
    82% ready
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.44;0.56;0.62;1" dur="9s" repeatCount="indefinite"/>
  </text>
</svg>
