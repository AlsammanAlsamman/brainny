[project]
name = "brainny"
version = "0.1.0"
description = "brAInny catches your ideas before the wind — techniques, precautions, and insights that would otherwise evaporate at the end of a session."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Alsamman M. Alsamman", email = "aalsamman100@gmail.com" },
]
keywords = ["ai", "claude", "knowledge-management", "notes", "productivity", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
brainny = "brainny.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brainny*"]

[tool.setuptools.package-data]
# The vendored D3 copy graph.html embeds inline (brainny/viz.py's
# _D3_JS) -- must ship in the built package, not just the editable
# dev-install source tree, or a real `pip install brainny` gets a
# FileNotFoundError importing brainny.viz.
brainny = ["vendor/*.js", "vendor/*.txt"]
